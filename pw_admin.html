<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRESS — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono:wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#04171F;
  --paper-2:#082833;
  --paper-3:#0d3340;
  --ink:#E4FBFF;
  --ink-soft:#87B5C0;
  --blue:#2FD6C4;
  --red:#FF9E5C;
  --rule:rgba(228,251,255,.13);
  --danger:#FF6B6B;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:"Space Mono",monospace}
.display{font-family:"Bricolage Grotesque",sans-serif;font-weight:800}

/* ---- LOGIN ---- */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{width:100%;max-width:380px}
.login-box h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem;letter-spacing:-.02em;margin-bottom:6px}
.login-box p{color:var(--ink-soft);font-size:.95rem;margin-bottom:28px}
label{display:block;font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
input[type="password"],input[type="text"],textarea,select{
  width:100%;background:var(--paper-2);border:1.5px solid var(--rule);border-radius:var(--r);
  color:var(--ink);padding:12px 14px;font-family:"Newsreader",serif;font-size:1rem;
  transition:border-color .2s;
}
input[type="password"]:focus,input[type="text"]:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--blue);color:var(--paper);border:none;border-radius:50px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1rem;
  padding:13px 24px;cursor:pointer;transition:opacity .2s,transform .15s;width:100%;margin-top:14px;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--rule);width:auto}
.btn.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff;width:auto;padding:8px 16px;font-size:.85rem}
.err{color:var(--danger);font-family:"Space Mono",monospace;font-size:.75rem;margin-top:10px;min-height:1.2em}

/* ---- APP SHELL ---- */
#app{display:none}
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 28px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1.5px solid var(--rule);
}
.topbar .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1rem;letter-spacing:.02em}
.topbar .brand span{color:var(--blue)}
.topbar-right{display:flex;align-items:center;gap:12px}
#logout-btn{font-family:"Space Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1.5px solid var(--rule);color:var(--ink-soft);border-radius:40px;padding:7px 14px;cursor:pointer}
#logout-btn:hover{border-color:var(--ink-soft);color:var(--ink)}

.layout{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:calc(100vh - 57px)}
.panel{padding:32px 28px;overflow-y:auto}
.panel-left{border-right:1.5px solid var(--rule)}

/* ---- FORM ---- */
.section-head{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;margin-bottom:22px}
.field{margin-bottom:18px}
.field label{margin-bottom:7px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea{resize:vertical;min-height:280px;line-height:1.65;font-size:.97rem}
.char-count{text-align:right;font-family:"Space Mono",monospace;font-size:.68rem;color:var(--ink-soft);margin-top:5px}
.slug-preview{font-family:"Space Mono",monospace;font-size:.75rem;color:var(--ink-soft);margin-top:6px;
  padding:7px 12px;background:var(--paper-3);border-radius:6px;word-break:break-all}
.form-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.form-actions .btn{width:auto;flex:1}
#save-status{font-family:"Space Mono",monospace;font-size:.74rem;color:var(--blue);min-height:1.4em;margin-top:12px;transition:opacity .3s}

/* ---- PREVIEW ---- */
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.preview-head h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.tab-row{display:flex;gap:4px}
.tab{font-family:"Space Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1.5px solid var(--rule);color:var(--ink-soft);border-radius:40px;padding:5px 12px;cursor:pointer}
.tab.active,.tab:hover{border-color:var(--blue);color:var(--blue)}

#preview-pane{display:block}
#posts-pane{display:none}

/* post preview render */
.post-preview{max-width:640px}
.post-preview .post-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:-.02em;line-height:.98;margin-bottom:14px}
.post-preview .post-meta{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:28px;padding-bottom:18px;border-bottom:1.5px solid var(--rule)}
.post-preview .post-body{font-size:1.05rem;line-height:1.8;color:var(--ink)}
.post-preview .post-body p{margin-bottom:1em}
.post-preview .post-body h1,.post-preview .post-body h2,.post-preview .post-body h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.01em;margin:1.4em 0 .5em}
.post-preview .post-body h1{font-size:1.8rem}
.post-preview .post-body h2{font-size:1.35rem}
.post-preview .post-body h3{font-size:1.1rem}
.post-preview .post-body ul,.post-preview .post-body ol{padding-left:1.4em;margin-bottom:1em}
.post-preview .post-body li{margin-bottom:.35em}
.post-preview .post-body code{font-family:"Space Mono",monospace;font-size:.85em;background:var(--paper-3);padding:2px 6px;border-radius:4px}
.post-preview .post-body pre{background:var(--paper-3);padding:16px;border-radius:var(--r);overflow-x:auto;margin-bottom:1em}
.post-preview .post-body pre code{background:none;padding:0}
.post-preview .post-body blockquote{border-left:3px solid var(--blue);padding-left:16px;color:var(--ink-soft);margin-bottom:1em}
.post-preview .post-body a{color:var(--blue)}
.post-preview .post-body hr{border:none;border-top:1.5px solid var(--rule);margin:1.6em 0}
.post-preview .post-body strong{font-weight:700}
.post-preview .post-body em{font-style:italic}
.empty-state{color:var(--ink-soft);font-family:"Space Mono",monospace;font-size:.8rem;padding:40px 0}

/* ---- POSTS LIST ---- */
.post-item{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1.5px solid var(--rule)}
.post-item-info h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1rem;margin-bottom:3px}
.post-item-info span{font-family:"Space Mono",monospace;font-size:.68rem;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;font-family:"Space Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  border-radius:40px;padding:3px 9px;margin-left:8px}
.pill.live{background:rgba(47,214,196,.15);color:var(--blue);border:1px solid rgba(47,214,196,.3)}
.pill.draft{background:rgba(228,251,255,.07);color:var(--ink-soft);border:1px solid var(--rule)}
.post-item-actions{display:flex;gap:8px;flex-shrink:0}
.edit-btn{font-family:"Space Mono",monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1.5px solid var(--rule);color:var(--ink-soft);border-radius:40px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.edit-btn:hover{border-color:var(--blue);color:var(--blue)}

@media(max-width:860px){.layout{grid-template-columns:1fr}.panel-left{border-right:none;border-bottom:1.5px solid var(--rule)}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="login-box">
    <h1 class="display">PRESS<span style="color:var(--blue)">·</span>Admin</h1>
    <p>Your writing desk for adixi.me</p>
    <div class="field">
      <label for="pw">Password</label>
      <input type="password" id="pw" placeholder="Enter your admin password" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">Enter the desk</button>
    <div class="err" id="login-err"></div>
    <p style="margin-top:20px;font-family:'Space Mono',monospace;font-size:.68rem;color:var(--ink-soft);line-height:1.7">
      Set your password by changing the <code style="background:var(--paper-2);padding:2px 5px;border-radius:4px">ADMIN_PW</code> value at the top of this file.<br>Keep this page private — don't link to it from the main site.
    </p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <header class="topbar">
    <div class="brand display">PRESS<span>·</span>Admin</div>
    <div class="topbar-right">
      <span class="mono" id="post-count" style="font-size:.72rem;color:var(--ink-soft)"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>

  <div class="layout">
    <!-- LEFT: write -->
    <div class="panel panel-left">
      <div class="section-head" id="form-heading">New post</div>

      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" placeholder="What's this post about?">
      </div>

      <div class="field">
        <label>URL slug <span style="font-weight:400;text-transform:none;letter-spacing:0">(auto-generated)</span></label>
        <div class="slug-preview mono" id="slug-preview">adixi.me/posts/your-title-here</div>
      </div>

      <div class="field">
        <label for="f-excerpt">One-line excerpt</label>
        <input type="text" id="f-excerpt" placeholder="The sentence readers see in the list — make it good">
      </div>

      <div class="field">
        <label for="f-body">Body <span style="font-weight:400;text-transform:none;letter-spacing:0">(Markdown supported)</span></label>
        <textarea id="f-body" placeholder="Write your post here.&#10;&#10;**bold**, _italic_, ## Heading, - bullet, `code`&#10;&#10;Just write — the preview updates live on the right."></textarea>
        <div class="char-count"><span id="word-count">0</span> words</div>
      </div>

      <div class="field-row">
        <div class="field" style="margin-bottom:0">
          <label for="f-date">Published date</label>
          <input type="text" id="f-date" placeholder="YYYY-MM-DD">
        </div>
        <div class="field" style="margin-bottom:0">
          <label for="f-status">Status</label>
          <select id="f-status" style="height:46px;cursor:pointer">
            <option value="false">Draft (not visible)</option>
            <option value="true">Published (live)</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" id="publish-btn">Publish to adixi.me</button>
        <button class="btn ghost" id="clear-btn">Clear</button>
      </div>
      <input type="hidden" id="editing-id">
      <div id="save-status"></div>
    </div>

    <!-- RIGHT: preview + posts list -->
    <div class="panel">
      <div class="preview-head">
        <h2 id="right-heading">Preview</h2>
        <div class="tab-row">
          <button class="tab active" id="tab-preview">Preview</button>
          <button class="tab" id="tab-posts">My posts</button>
        </div>
      </div>

      <div id="preview-pane">
        <div class="post-preview" id="live-preview">
          <div class="empty-state">Start typing on the left to see a live preview…</div>
        </div>
      </div>

      <div id="posts-pane">
        <div id="posts-manager"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* ============================================================
     CONFIGURATION — change these two values
     ============================================================ */
  var ADMIN_PW = "pressadmin2026";        /* change this to your own password */
  var SB_URL   = "https://ezzqilqorrmsiwzyqnxl.supabase.co";
  var SB_ANON  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6enFpbHFvcnJtc2l3enlxbnhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTE1MzAsImV4cCI6MjA5Njk2NzUzMH0.wTW6naGBQtk8iI50TUaLMzENfvbXx0TcF0nk7UUEv1E";
  /* ============================================================ */

  var HEADERS = {"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON,"Content-Type":"application/json","Prefer":"return=representation"};

  /* ---- auth ---- */
  var authed = sessionStorage.getItem("press_admin")==="1";
  if(authed) showApp();

  document.getElementById("login-btn").addEventListener("click", function(){
    if(document.getElementById("pw").value===ADMIN_PW){ sessionStorage.setItem("press_admin","1"); showApp(); }
    else{ document.getElementById("login-err").textContent="Wrong password."; }
  });
  document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") document.getElementById("login-btn").click(); });
  document.getElementById("logout-btn").addEventListener("click",function(){ sessionStorage.removeItem("press_admin"); location.reload(); });

  function showApp(){ document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block"; setTodayDate(); loadPosts(); }

  /* ---- helpers ---- */
  function slugify(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
  function readMins(b){ return Math.max(1,Math.round((b||"").split(/\s+/).filter(Boolean).length/200)); }
  function setTodayDate(){ var d=new Date(); document.getElementById("f-date").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  /* ---- slug + word count live ---- */
  document.getElementById("f-title").addEventListener("input",function(){
    var s=slugify(this.value||"");
    document.getElementById("slug-preview").textContent="adixi.me/posts/"+(s||"your-title-here");
  });
  document.getElementById("f-body").addEventListener("input",function(){
    var words=(this.value||"").split(/\s+/).filter(Boolean).length;
    document.getElementById("word-count").textContent=words;
    renderPreview();
  });
  document.getElementById("f-title").addEventListener("input",renderPreview);
  document.getElementById("f-excerpt").addEventListener("input",renderPreview);

  /* ---- lightweight markdown render ---- */
  function md(src){
    if(!src) return "";
    return src
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/^#{3} (.+)$/gm,"<h3>$1</h3>")
      .replace(/^#{2} (.+)$/gm,"<h2>$1</h2>")
      .replace(/^# (.+)$/gm,"<h1>$1</h1>")
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/_(.+?)_/g,"<em>$1</em>")
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/^---$/gm,"<hr>")
      .replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>")
      .replace(/^\- (.+)$/gm,"<li>$1</li>")
      .replace(/(<li>.*<\/li>)/s,function(m){ return "<ul>"+m+"</ul>"; })
      .replace(/\n\n+/g,"</p><p>")
      .replace(/^(?!<[hbuol]|<\/[hbuol]|<hr|<bl)(.+)$/gm,"$1")
      .replace(/(<\/h[123]>|<\/blockquote>|<\/ul>|<hr>)\s*<\/p>/g,"$1")
      .replace(/<p>(<h[123]>|<blockquote>|<ul>|<hr>)/g,"$1");
  }
  function renderPreview(){
    var title=document.getElementById("f-title").value||"";
    var excerpt=document.getElementById("f-excerpt").value||"";
    var body=document.getElementById("f-body").value||"";
    var date=document.getElementById("f-date").value||"";
    var p=document.getElementById("live-preview");
    if(!title && !body){ p.innerHTML='<div class="empty-state">Start typing on the left to see a live preview…</div>'; return; }
    var mins=readMins(body);
    p.innerHTML='<div class="post-preview">'
      +'<h1 class="post-title">'+(title||"Untitled")+'</h1>'
      +'<div class="post-meta">'+(date||"—")+(excerpt?' · <em>'+excerpt+'</em>':'')+' · '+mins+' min read</div>'
      +'<div class="post-body"><p>'+md(body)+'</p></div>'
      +'</div>';
  }

  /* ---- tabs ---- */
  document.getElementById("tab-preview").addEventListener("click",function(){
    document.getElementById("preview-pane").style.display="block";
    document.getElementById("posts-pane").style.display="none";
    document.getElementById("right-heading").textContent="Preview";
    this.classList.add("active"); document.getElementById("tab-posts").classList.remove("active");
  });
  document.getElementById("tab-posts").addEventListener("click",function(){
    document.getElementById("preview-pane").style.display="none";
    document.getElementById("posts-pane").style.display="block";
    document.getElementById("right-heading").textContent="My posts";
    this.classList.add("active"); document.getElementById("tab-preview").classList.remove("active");
    loadPosts();
  });

  /* ---- Supabase CRUD ---- */
  var allPosts=[];

  function loadPosts(){
    fetch(SB_URL+"/rest/v1/posts?select=id,title,slug,excerpt,body,published_at,published&order=published_at.desc",{headers:HEADERS})
    .then(function(r){ return r.json(); })
    .then(function(data){
      allPosts=Array.isArray(data)?data:[];
      document.getElementById("post-count").textContent=allPosts.length+" post"+(allPosts.length!==1?"s":"");
      renderPostsManager();
    }).catch(function(){ document.getElementById("post-count").textContent=""; });
  }

  function renderPostsManager(){
    var el=document.getElementById("posts-manager");
    if(!allPosts.length){ el.innerHTML='<div class="empty-state">No posts yet — write your first one on the left.</div>'; return; }
    el.innerHTML=allPosts.map(function(p){
      var d=p.published_at ? p.published_at.slice(0,10) : "—";
      return '<div class="post-item">'
        +'<div class="post-item-info">'
          +'<h4>'+p.title+'<span class="pill '+(p.published?"live":"draft")+'">'+(p.published?"Live":"Draft")+'</span></h4>'
          +'<span>'+d+' · /posts/'+p.slug+'</span>'
        +'</div>'
        +'<div class="post-item-actions">'
          +'<button class="edit-btn" onclick="editPost(\''+p.id+'\')">Edit</button>'
          +'<button class="btn danger" onclick="deletePost(\''+p.id+'\',\''+p.title.replace(/'/g,"\\'")+'\')" >Delete</button>'
        +'</div>'
        +'</div>';
    }).join("");
  }

  window.editPost=function(id){
    var p=allPosts.find(function(x){return x.id===id;});
    if(!p) return;
    document.getElementById("f-title").value=p.title||"";
    document.getElementById("f-excerpt").value=p.excerpt||"";
    document.getElementById("f-body").value=p.body||"";
    document.getElementById("f-date").value=(p.published_at||"").slice(0,10);
    document.getElementById("f-status").value=String(p.published);
    document.getElementById("slug-preview").textContent="adixi.me/posts/"+p.slug;
    document.getElementById("editing-id").value=id;
    document.getElementById("form-heading").textContent="Editing post";
    document.getElementById("publish-btn").textContent="Save changes";
    document.getElementById("tab-preview").click();
    renderPreview();
    window.scrollTo({top:0,behavior:"smooth"});
  };

  window.deletePost=function(id,title){
    if(!confirm('Delete "'+title+'"? This cannot be undone.')) return;
    fetch(SB_URL+"/rest/v1/posts?id=eq."+id,{method:"DELETE",headers:HEADERS})
    .then(function(){ setStatus("Deleted.","var(--danger)"); allPosts=allPosts.filter(function(p){return p.id!==id;}); renderPostsManager(); })
    .catch(function(){ setStatus("Delete failed — try again.","var(--danger)"); });
  };

  function setStatus(msg,col){
    var el=document.getElementById("save-status");
    el.textContent=msg; el.style.color=col||"var(--blue)";
    setTimeout(function(){ el.textContent=""; },4000);
  }

  document.getElementById("clear-btn").addEventListener("click",function(){
    ["f-title","f-excerpt","f-body"].forEach(function(id){document.getElementById(id).value="";});
    document.getElementById("f-status").value="false";
    document.getElementById("editing-id").value="";
    document.getElementById("form-heading").textContent="New post";
    document.getElementById("publish-btn").textContent="Publish to adixi.me";
    document.getElementById("slug-preview").textContent="adixi.me/posts/your-title-here";
    document.getElementById("word-count").textContent="0";
    document.getElementById("live-preview").innerHTML='<div class="empty-state">Start typing on the left to see a live preview…</div>';
    setTodayDate();
  });

  document.getElementById("publish-btn").addEventListener("click",function(){
    var title=document.getElementById("f-title").value.trim();
    var body=document.getElementById("f-body").value.trim();
    if(!title || !body){ setStatus("Title and body are required.","var(--danger)"); return; }
    var slug=slugify(title);
    var payload={
      title:title, slug:slug,
      excerpt:document.getElementById("f-excerpt").value.trim()||null,
      body:body,
      published_at:document.getElementById("f-date").value||new Date().toISOString().slice(0,10),
      published:document.getElementById("f-status").value==="true"
    };
    var editId=document.getElementById("editing-id").value;
    var url=editId ? SB_URL+"/rest/v1/posts?id=eq."+editId : SB_URL+"/rest/v1/posts";
    var method=editId?"PATCH":"POST";
    document.getElementById("publish-btn").textContent="Saving…";
    fetch(url,{method:method,headers:HEADERS,body:JSON.stringify(payload)})
    .then(function(r){ return r.ok?r.json():r.text().then(function(t){throw new Error(t);}); })
    .then(function(){
      setStatus(editId?"Saved! Refresh adixi.me to see changes.":"Published! Refresh adixi.me to see it live.");
      document.getElementById("publish-btn").textContent=editId?"Save changes":"Publish to adixi.me";
      loadPosts();
    })
    .catch(function(e){ console.error(e); setStatus("Something went wrong — check the console.","var(--danger)"); document.getElementById("publish-btn").textContent=editId?"Save changes":"Publish to adixi.me"; });
  });
})();
